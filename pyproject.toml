[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-tutorial"
version = "1.0.0"
description = "桌面智能体：pywebview 窗口 + 四工具循环 + MCP，课程大作业"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "openai>=1.30,<2",
    "pywebview>=5.0,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 只留真会引起运行时错误的规则：语法错、未定义名字、未使用导入。
# 排版交给编辑器，别让格式噪音盖住真问题。
select = ["E9", "F"]
