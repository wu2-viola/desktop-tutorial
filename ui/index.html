<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Agent — 桌面智能体</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="layout">
  <!-- 左：资源管理器 -->
  <aside id="left">
    <div class="col-head">资源管理器</div>
    <div class="col-path" id="tree-path">workspace/</div>
    <ul id="tree" class="tree"></ul>
    <div class="left-foot">
      <div id="mcp-badge" class="badge mcp-off" title="MCP server 状态">MCP · 未加载</div>
      <div id="provider-badge" class="badge">模型 · 未配置</div>
    </div>
  </aside>

  <!-- 中：对话（结论在这里） -->
  <main id="chat">
    <div id="chat-top">
      <div class="brand">
        <span class="brand-name">◆ Desktop Agent</span>
        <span class="brand-sub" id="brand-sub">桌面智能体训练营</span>
      </div>
      <div class="chat-top-right">
        <span id="model-badge" class="badge" title="当前模型">模型 · …</span>
        <span id="run-badge" class="badge hidden">● 运行中</span>
        <button id="btn-new" class="ghost-btn" title="清空对话，开始新会话">＋ 新建会话</button>
        <button id="btn-settings" class="ghost-btn" title="设置 API Key">⚙ 设置</button>
      </div>
    </div>
    <div id="stream"></div>
    <div id="toggles">
      <label><input type="checkbox" id="tg-skills" checked> 技能</label>
      <label><input type="checkbox" id="tg-hooks" checked> 钩子</label>
      <span id="activity"></span>
      <span id="caps-line"></span>
    </div>
    <div id="composer">
      <textarea id="task-input" rows="2"
        placeholder="让智能体做点什么…（Enter 发送，Shift+Enter 换行）"
        autocomplete="off"></textarea>
      <div id="composer-foot">
        <span id="ws-hint">工作目录：workspace/</span>
        <div class="composer-btns">
          <button id="btn-stop" class="danger" disabled>■ 停止</button>
          <button id="btn-send">发送</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 右：工具调用 trace（成功 / 失败在这里） -->
  <aside id="trace">
    <div class="col-head">工具调用 trace
      <button id="btn-clear-trace" class="ghost-btn">清空</button>
    </div>
    <div id="trace-list"></div>
  </aside>
</div>

<!-- 文件查看弹窗 -->
<div id="file-modal" class="modal hidden">
  <div class="modal-card file-card">
    <div class="modal-head">
      <span id="file-title">文件</span>
      <button id="file-close" class="ghost-btn">✕ 关闭</button>
    </div>
    <pre id="file-view" class="file-view"></pre>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-card">
    <h3>设置</h3>
    <label>API Key（DeepSeek，存到用户目录，不入仓库）</label>
    <input id="cfg-key" type="password" placeholder="sk-...">
    <label>Base URL</label>
    <input id="cfg-url" type="text">
    <label>模型</label>
    <input id="cfg-model" type="text">
    <div class="modal-foot">
      <button id="cfg-cancel" class="ghost-btn">取消</button>
      <button id="cfg-save">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
